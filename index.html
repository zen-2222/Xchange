<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xchange</title>
     <link rel="icon" type="image/x-icon" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <script type="module" defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

            <section class="container__content">
                <img src="/img/logo.png" alt="Xchange logo" class="container__img">
                
                <form action="post" class="form">
                    <div class="form__input-box">
                            <div class="form__select-styling">
                                <label for="base" class="form__label">Pick a currency:</label>
                                <select id="base" name="base" class="form__select form__select--base">
                                     <button>
                                        <selectedcontent></selectedcontent>
                                    <img src="/img/chevron-down-solid-full.svg" class="select__picker-icon"></button>
                                    <option>placeholder</option>


                                </select>
                            </div>
                            <input  type="text" class="form__input form__input--base" name="base" value="1">
                    </div>
                    
                    <button type="button" class="button button--swap">⇅</button>

                    <div class="form__input-box">
                    
                        <div class="form__select-styling">
                                <label for="target" class="form__label">Pick a currency:</label>
                                <select id="target" name="target" class="form__select form__select--target">
                                    <button>
                                        <selectedcontent></selectedcontent>
                                    <img src="/img/chevron-down-solid-full.svg" class="select__picker-icon"></button>
                                    <option>placeholder</option>
                                </select>
                        </div>
                        <input type="text" class="form__input form__input--target" name="target" value="2">
                    </div>


                </form>

                <footer class="container__footer">

                    <p>&copy; zen-2222, <time datetime="2026">2026</time>
                    </p>
                
                </footer>

            </section>

            <section class="container__showcase">
                
                <p class="showcase__text">Find the exchange rate for more than <span class="showcase__currencies">187 currencies.</span></p>

                <p class="showcase__currency showcase__currency--1">$</p>
                <p class="showcase__currency showcase__currency--2">¥</p>
                <p class="showcase__currency showcase__currency--3">£</p>
                <p class="showcase__currency showcase__currency--4">₣</p>
                <p class="showcase__currency showcase__currency--5">€</p>
                <p class="showcase__currency showcase__currency--6">₽</p>
                

            </section>




    </div>



</body>
</html>
